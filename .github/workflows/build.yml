name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          unzip -q -o catatkeuanganku.zip
          cp -a catatkeuanganku/. .
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.namakamu --project-name catatkeuanganku .
          fi
          rm -f test/widget_test.dart
          python3 tool/patch_android.py .

      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: CatatKeuanganKu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
