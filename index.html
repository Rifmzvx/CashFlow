:root{

.chk{display:flex;gap:10px;align-items:center;margin:12px 0}.chk input{width:22px;height:22px;min-height:0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.tile:active{transform:scale(.97)}
.tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.tile.t-warn .ti{background:var(--warn-soft);color:var(--warn)}.tile.t-warn .bdg{background:var(--warn);color:var(--bg)}
.tile.t-out .ti{background:var(--out-soft);color:var(--out)}.tile.t-mute .ti{background:var(--surface2);color:var(--muted)}
.tile.t-bad .bdg{background:var(--out);color:#fff}

.pill.ok{background:var(--in-soft);color:var(--in)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--out-soft);color:var(--out)}

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
/*LOGIC-START*/
const T = { income: 'income', expense: 'expense', transfer: 'transfer', adjustment: 'adjustment', savingIn: 'saving_in', savingOut: 'saving_out' };

/* Pengaruh satu transaksi terhadap saldo sebuah dompet. */
function walletDelta(t, wid) {
  switch (t.type) {
    case T.income: case T.adjustment: case T.savingOut:
      return t.walletId === wid ? t.amount : 0;
    case T.expense: case T.savingIn:
      return t.walletId === wid ? -t.amount : 0;
    case T.transfer: {
      let d = 0;
      if (t.walletId === wid) d -= t.amount;
      if (t.toWalletId === wid) d += t.amount;
      return d;
    }
  }
  return 0;
}
function savingsDelta(t, gid) {
  if (t.savingsId !== gid) return 0;
  if (t.type === T.savingIn) return t.amount;
  if (t.type === T.savingOut) return -t.amount;
  return 0;
}
function walletBalance(wid, initial, trxs) {
  let total = initial;
  for (const t of trxs) total += walletDelta(t, wid);
  return total;
}
function savingsBalance(gid, trxs) {
  let total = 0;
  for (const t of trxs) total += savingsDelta(t, gid);
  return total;
}
/* Mengembalikan pesan kesalahan, atau null jika valid. */
function validateTrx(o) {
  const { type, amount, walletId, toWalletId, savingsId } = o;
  if (type === T.adjustment) { if (!amount) return 'Selisih saldo tidak boleh nol'; }
  else if (!(amount > 0)) return 'Nominal harus lebih dari 0';
  switch (type) {
    case T.income: case T.expense: case T.adjustment:
      if (walletId == null) return 'Pilih dompet'; break;
    case T.transfer:
      if (walletId == null || toWalletId == null) return 'Pilih dompet asal dan tujuan';
      if (walletId === toWalletId) return 'Dompet asal dan tujuan tidak boleh sama'; break;
    case T.savingIn: case T.savingOut:
      if (savingsId == null) return 'Pilih tabungan';
      if (walletId == null) return 'Pilih dompet'; break;
  }
  return null;
}
/* TRX-2026-0001, TRX-2026-0002, ... (mulai lagi dari 0001 tiap tahun) */
function nextTrxNumber(year, last) {
  let seq = 0;
  if (last) {
    const p = String(last).split('-');
    if (p.length === 3 && p[1] === String(year)) seq = parseInt(p[2], 10) || 0;
  }
  return 'TRX-' + year + '-' + String(seq + 1).padStart(4, '0');
}
/* Perkiraan tanggal (ms) target tercapai dari setoran bersih 30 hari; null jika belum bisa. */
function estimateGoalDate(target, current, net30, nowMs) {
  if (!(target > 0)) return null;
  if (current >= target) return nowMs;
  if (net30 <= 0) return null;
  const days = Math.ceil((target - current) / (net30 / 30));
  if (days > 36500) return null;
  return nowMs + days * 86400000;
}
/* Batas progres terbesar (50/75/100) yang baru terlewati, atau 0. */
function milestoneCrossed(before, after, target) {
  if (!(target > 0)) return 0;
  const pct = v => Math.floor((v * 100) / target);
  const b = pct(before), a = pct(after);
  for (const m of [100, 75, 50]) if (b < m && a >= m) return m;
  return 0;
}

/* ---------- format ---------- */
function formatRupiah(n, withSymbol = true) {
  const neg = n < 0;
  const d = String(Math.abs(Math.round(n)));
  let out = '';
  for (let i = 0; i < d.length; i++) {
    if (i > 0 && (d.length - i) % 3 === 0) out += '.';
    out += d[i];
  }
  return (neg ? '-' : '') + (withSymbol ? 'Rp' : '') + out;
}
function parseRupiah(s) {
  let d = String(s || '').replace(/[^0-9]/g, '');
  if (d.length > 13) d = d.slice(0, 13);
  return d ? parseInt(d, 10) : 0;
}
/* 1.250.000 -> "1,25 jt", 350.000 -> "350 rb" (untuk label grafik) */
function shortRupiah(n) {
  const a = Math.abs(n);
  const f = (v, u) => (Math.round(v * 10) / 10).toString().replace('.', ',') + ' ' + u;
  if (a >= 1e9) return f(n / 1e9, 'M');
  if (a >= 1e6) return f(n / 1e6, 'jt');
  if (a >= 1e3) return f(n / 1e3, 'rb');
  return String(n);
}

/* ---------- waktu: semua jam dinding WIB, disimpan sebagai 'YYYY-MM-DDTHH:mm' ---------- */
const BULAN_P = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN_L = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI_P = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
function wibNowISO(ms) { return new Date((ms == null ? Date.now() : ms) + 7 * 3600000).toISOString().slice(0, 16); }
function isoToMs(iso) { return Date.parse(iso.slice(0, 16) + ':00Z'); }
function monthKey(iso) { return iso.slice(0, 7); }
function addMonths(key, n) {
  const [y, m] = key.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
function monthLabel(key) { const [y, m] = key.split('-').map(Number); return BULAN_L[m - 1] + ' ' + y; }
function monthShort(key) { return BULAN_P[parseInt(key.slice(5, 7), 10) - 1]; }
function fmtDate(iso) { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return d + ' ' + BULAN_P[m - 1] + ' ' + y; }
function fmtTime(iso) { return iso.slice(11, 16); }
function fmtDateTime(iso) { return fmtDate(iso) + ' ' + fmtTime(iso); }
function dayHeading(iso, nowIso) {
  const day = iso.slice(0, 10), today = nowIso.slice(0, 10);
  if (day === today) return 'Hari ini';
  const y = new Date(Date.parse(today + 'T00:00:00Z') - 86400000).toISOString().slice(0, 10);
  if (day === y) return 'Kemarin';
  const wd = HARI_P[new Date(Date.parse(day + 'T00:00:00Z')).getUTCDay()];
  return wd + ', ' + fmtDate(iso);
}

/* ---------- agregasi laporan ---------- */
function monthTotals(trxs, key) {
  let income = 0, expense = 0;
  for (const t of trxs) {
    if (monthKey(t.at) !== key || t.nonOp) continue;
    if (t.type === T.income) income += t.amount;
    else if (t.type === T.expense) expense += t.amount;
  }
  return { income, expense, net: income - expense };
}
function categoryBreakdown(trxs, key, type) {
  const m = new Map();
  for (const t of trxs) {
    if (t.type !== type || monthKey(t.at) !== key || t.nonOp) continue;
    m.set(t.categoryId, (m.get(t.categoryId) || 0) + t.amount);
  }
  return [...m.entries()].map(([categoryId, total]) => ({ categoryId, total })).sort((a, b) => b.total - a.total);
}
function monthSeries(trxs, key, count) {
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const k = addMonths(key, -i);
    out.push(Object.assign({ key: k }, monthTotals(trxs, k)));
  }
  return out;
}
/* Skala sumbu "rapi": 1, 2, 2,5, 5 x 10^n */
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const s of [1, 2, 2.5, 5, 10]) if (v <= s * p) return s * p;
  return 10 * p;
}

/* ================= FASE 2: administrasi ================= */
/* Nomor dokumen umum: INV-2026-0001 */
function nextDocNumber(prefix, year, last) {
  let seq = 0;
  if (last) { const p = String(last).split('-'); if (p.length === 3 && p[0] === prefix && p[1] === String(year)) seq = parseInt(p[2], 10) || 0; }
  return prefix + '-' + year + '-' + String(seq + 1).padStart(4, '0');
}
/* Anggaran: level ok (<80%), warn (80-99%), over (>=100%) */
function budgetStatus(limit, spent) {
  if (!(limit > 0)) return { pct: 0, left: 0, level: 'ok' };
  const pct = Math.floor(spent * 100 / limit);
  return { pct, left: limit - spent, level: pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok' };
}
/* Sisa utang/piutang: hanya pembayaran yang transaksinya belum dihapus */
function debtRemaining(amount, payments, trxs) {
  const alive = new Set(trxs.filter(t => !t.deleted).map(t => t.id));
  let paid = 0;
  for (const p of payments) if (alive.has(p.trxId)) paid += p.amount;
  return { paid, left: Math.max(0, amount - paid) };
}
/* Total faktur (rupiah bulat): subtotal, diskon (nominal), pajak (% dari setelah diskon) */
function invoiceTotal(items, discount, taxPct) {
  const sub = items.reduce((a, i) => a + Math.round((i.qty || 0) * (i.price || 0)), 0);
  const disc = Math.min(Math.max(discount || 0, 0), sub);
  const tax = Math.round((sub - disc) * (taxPct || 0) / 100);
  return { sub, disc, tax, total: sub - disc + tax };
}
/* draft | terkirim | lunas | jatuh tempo */
function invoiceStatus(inv, todayIso, left) {
  if (left === undefined ? !!inv.paidAt : left === 0) return 'lunas';
  if (inv.due && inv.due < String(todayIso).slice(0, 10)) return 'jatuh_tempo';
  return 'terkirim';
}
function isMonthClosed(closed, iso) { return closed.some(c => c.key === String(iso).slice(0, 7)); }
/* Penyusutan garis lurus: nilai buku pada bulan nowKey */
function assetValue(cost, salvage, lifeMonths, buyKey, nowKey) {
  if (!(lifeMonths > 0)) return cost;
  const [y1, m1] = buyKey.split('-').map(Number), [y2, m2] = nowKey.split('-').map(Number);
  const age = Math.max(0, (y2 * 12 + m2) - (y1 * 12 + m1));
  const dep = Math.round((cost - salvage) * Math.min(age, lifeMonths) / lifeMonths);
  return cost - dep;
}
/* Zakat maal: 2,5% bila harta >= nisab (85 g emas) */
function zakatMaal(wealth, goldPricePerGram) {
  const nisab = Math.round(85 * goldPricePerGram);
  const wajib = goldPricePerGram > 0 && wealth >= nisab;
  return { nisab, wajib, zakat: wajib ? Math.round(wealth * 0.025) : 0 };
}
/* Zakat penghasilan: nisab bulanan = nisab tahunan / 12; 2,5% dari penghasilan */
function zakatPenghasilan(monthlyIncome, goldPricePerGram) {
  const nisabBulan = Math.round(85 * goldPricePerGram / 12);
  const wajib = goldPricePerGram > 0 && monthlyIncome >= nisabBulan;
  return { nisabBulan, wajib, zakat: wajib ? Math.round(monthlyIncome * 0.025) : 0 };
}
/* Estimasi PPh final UMKM 0,5% dari omzet (bukan nasihat pajak) */
function pphFinal(omzet) { return Math.round(Math.max(0, omzet) * 0.005); }
/* Tagihan rutin: tanggal jatuh tempo bulan ini, status relatif terhadap hari ini */
function billStatus(day, lastPaidKey, todayIso) {
  const key = todayIso.slice(0, 7), today = parseInt(todayIso.slice(8, 10), 10);
  if (lastPaidKey === key) return { state: 'lunas', days: 0 };
  const d = day - today;
  return { state: d < 0 ? 'terlambat' : d <= 7 ? 'segera' : 'nanti', days: d };
}
/* Bulan-bulan transaksi berulang yang jatuh tempo dan belum dibuat (maks. 24 bulan) */
function dueMonths(startKey, lastKey, day, todayIso) {
  const cur = todayIso.slice(0, 7), today = todayIso.slice(0, 10), out = [];
  let k = lastKey ? addMonths(lastKey, 1) : startKey;
  if (!k) return out;
  const floor = addMonths(cur, -23); if (k < floor) k = floor;
  for (let i = 0; i < 24 && k <= cur; i++, k = addMonths(k, 1)) {
    if (k + '-' + String(day).padStart(2, '0') <= today) out.push(k); else break;
  }
  return out;
}
/* Laba rugi sederhana: pendapatan - beban; margin dalam % (null jika tanpa pendapatan) */
function labaRugi(trxs, key) {
  const m = monthTotals(trxs, key);
  return { income: m.income, expense: m.expense, net: m.net, margin: m.income > 0 ? Math.round(m.net * 100 / m.income) : null };
}
/*LOGIC-END*/

    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};

function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}

/* ================= helpers ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function totalBal(){return S.wallets.filter(function(w){return !w.archived}).reduce(function(a,w){return a+bal(w)},0)}

function typeLabel(t){return{income:'Pemasukan',expense:'Pengeluaran',transfer:'Transfer',adjustment:'Penyesuaian saldo',saving_in:'Setor tabungan',saving_out:'Tarik tabungan'}[t]}
function lastNo(year){
  var best=null;S.trxs.forEach(function(t){if(String(t.no).indexOf('TRX-'+year+'-')===0&&(!best||t.no>best))best=t.no});return best}
function addAudit(action,t,detail){S.audit.unshift({id:nid(),at:nowIso(),action:action,no:t?t.no:'',detail:detail||''});if(S.audit.length>300)S.audit.length=300}

  if(t.type==='adjustment')return {title:'Penyesuaian saldo',sub:w?w.name:''};

 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

function goalMini(g){var cur=Math.max(0,goalBal(g)),p=g.target>0?Math.min(100,Math.floor(cur*100/g.target)):0;

function chart(series){
  var max=0;series.forEach(function(s){max=Math.max(max,s.income,s.expense)});

/* ---- tabungan ---- */
function goalNet30(g){
  var cut=wibNowISO(Date.now()-30*86400000),n=0;
  live().forEach(function(t){if(t.savingsId===g.id&&t.at>=cut)n+=savingsDelta(t,g.id)});return n}
function goalView(){
  var gs=S.goals.filter(function(g){return !g.archived});
  return head('Tabungan','Target & progres',' <button class="btn pri sm" data-act="goal-new">+ Target</button>')
  +(gs.length?gs.map(function(g){
    var cur=Math.max(0,goalBal(g)),p=g.target>0?Math.min(100,Math.floor(cur*100/g.target)):0;
    var est=estimateGoalDate(g.target,cur,goalNet30(g),Date.now());
    var estTxt=cur>=g.target?'Target tercapai 🎉':est?'Perkiraan tercapai: '+fmtDate(wibNowISO(est)):'Perkiraan belum bisa dihitung (belum ada setoran 30 hari terakhir)';
    return '<div class="card"><div class="mrow"><h2 style="margin:0">'+esc(g.name)+'</h2><span class="pill">'+p+'%</span></div>'
     +'<div class="big num" style="font-size:24px;margin:8px 0 6px">'+formatRupiah(cur)+'</div>'
     +'<div class="bar" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'
     +'<div class="sub" style="margin:6px 0 12px">Target '+formatRupiah(g.target)+' · Kurang '+formatRupiah(Math.max(0,g.target-cur))+'<br>'+estTxt+'</div>'
     +'<div class="row"><button class="btn pri sm grow" data-act="save-in" data-id="'+g.id+'">Setor</button><button class="btn sm grow" data-act="save-out" data-id="'+g.id+'">Tarik</button><button class="btn sm" data-act="goal-edit" data-id="'+g.id+'" aria-label="Ubah target">Ubah</button></div></div>'}).join('')
  :'<div class="empty">Belum ada target tabungan. Buat target pertama, mis. Liburan atau Dana Darurat.</div>');
}

function runRecurring(){
  var now=nowIso(),n=0;
  S.recurring.forEach(function(r){
    if(r.archived)return;
    dueMonths(r.startKey,r.lastKey,r.day,now).forEach(function(k){
      r.lastKey=k;
      var at=k+'-'+String(r.day).padStart(2,'0')+'T08:00';
      if(isMonthClosed(S.closed,at)||!byId(S.wallets,r.walletId))return;
      addTrxRaw({type:r.type,amount:r.amount,walletId:r.walletId,categoryId:r.categoryId,at:at,note:'Berulang: '+r.name});n++;
    });
  });
  if(n)persist();
  return n;
}

function getTheme(){try{return localStorage.getItem('theme')||'auto'}catch(e){return ui.theme||'auto'}}
function setTheme(m){ui.theme=m;try{localStorage.setItem('theme',m)}catch(e){}applyTheme()}
function applyTheme(){var m=getTheme(),r=document.documentElement;if(m==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m)}

/* ================= PIN ================= */
function hashPin(p){
  try{var enc=new TextEncoder().encode('catat:'+p);return crypto.subtle.digest('SHA-256',enc).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  catch(e){var h=5381;p='catat:'+p;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return Promise.resolve('x'+h)}
}
function hashPinSafe(p){return Promise.resolve().then(function(){return hashPin(p)}).catch(function(){var h=5381;p='catat:'+p;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return 'x'+h})}

/* ================= foto ================= */
function compress(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var out=null,sizes=[1000,800,640,480],qs=[.7,.6,.5];
    outer:for(var si=0;si<sizes.length;si++){var k=Math.min(1,sizes[si]/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      for(var qi=0;qi<qs.length;qi++){out=c.toDataURL('image/jpeg',qs[qi]);if(out.length<=200000)break outer}}
    URL.revokeObjectURL(url);res(out)};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('gambar'))};img.src=url})}

/* ================= unduh ================= */
function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(key){
  var rows=[['No','Tanggal','Jam','Jenis','Kategori/Tujuan','Dompet','Dompet tujuan','Nominal','Catatan']];
  live().filter(function(t){return key?monthKey(t.at)===key:true}).sort(function(a,b){return a.at<b.at?-1:1}).forEach(function(t){
    var d=describe(t),w=byId(S.wallets,t.walletId),w2=byId(S.wallets,t.toWalletId);
    rows.push([t.no,t.at.slice(0,10),fmtTime(t.at),typeLabel(t.type),d.title,w?w.name:'',w2?w2.name:'',t.amount,t.note])});
  return '﻿'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function saveFile(filename,data){
  if(ui.dl){
    ui.dl.save({filename:filename,data:data}).then(function(){toast('File disimpan')}).catch(function(e){
      var c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'Tunggu sebentar, lalu coba lagi':'Tidak bisa menyimpan file di tampilan ini')});
    return;
  }
  try{
    var type=/\.json$/.test(filename)?'application/json':/\.csv$/.test(filename)?'text/csv':'text/html';
    var url=URL.createObjectURL(new Blob([data],{type:type})),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);toast('File diunduh');
  }catch(e){toast('Tidak bisa mengunduh file di tampilan ini')}
}


/* ================= aksi ================= */
function readForm(){
  document.querySelectorAll('[data-f]').forEach(function(el){
    var f=el.getAttribute('data-f'),v=el.value;
    if(!ui.draft)return;
    if(el.getAttribute('data-i')!==null){var it=ui.draft.items[+el.getAttribute('data-i')];if(it)it[f]=el.getAttribute('data-money')?parseRupiah(v):f==='qty'?(parseFloat(String(v).replace(',','.'))||0):v;return}
    if(el.type==='checkbox'){ui.draft[f]=el.checked;return}
    if(el.getAttribute('data-money'))ui.draft[f]=parseRupiah(v);
    else if(/Id$/.test(f))ui.draft[f]=v===''?null:+v;
    else ui.draft[f]=v;
  });
}

var sync={st:'init',msg:'',db:null,col:null,base:null,lastPushedVer:null,photos:{},hashes:{},chunkCount:0,busy:false,dirty:false,timer:null,retry:null,lastAt:null,loadingPh:{},unsub:null,conflict:null};
var CHUNK=300;
function bump(){S.ver=Date.now().toString(36)+Math.random().toString(36).slice(2,7);S.savedAt=Date.now()}
function kvGet(k){return idbGet(k).catch(function(){return lsGet(k)})}
function kvSet(k,v){return idbSet(k,v).catch(function(){try{lsSet(k,v)}catch(e){}})}
function saveSyncMeta(){return kvSet('sync',{base:sync.base,photos:sync.photos,lastAt:sync.lastAt})}
function setSt(st,msg){sync.st=st;sync.msg=msg||'';if(!ui.sheet||ui.sheet.k==='sync')render()}
function syncLabel(){return {init:'Menyiapkan…',na:'Tidak tersedia',ok:'Tersinkron',push:'Menyimpan…',pull:'Memuat…',error:'Gagal',conflict:'Perlu dipilih',off:'Mati'}[sync.st]||''}
function syncBadge(){var t={ok:' · ☁ tersinkron',push:' · ☁ menyimpan…',pull:' · ☁ memuat…',error:' · ☁ gagal sinkron',conflict:' · ☁ perlu dipilih'}[sync.st];return t||''}
function buildChunks(src){
  var list=src.trxs.map(function(t){var c=Object.assign({},t);delete c.photo;return c}),out=[];
  for(var i=0;i<list.length;i+=CHUNK)out.push(JSON.stringify({i:out.length,trxs:list.slice(i,i+CHUNK)}));
  return out;
}
function buildMeta(src,chunkCount){
  var m=Object.assign({},src);delete m.trxs;m.chunkCount=chunkCount;m.trxCount=src.trxs.length;m.audit=src.audit.slice(0,300);
  if(JSON.stringify(m).length>240000)m.audit=m.audit.slice(0,40);
  return m;
}
function schedulePush(){
  if(!sync.col||sync.st==='conflict'||sync.st==='na'||sync.st==='off')return;
  clearTimeout(sync.timer);sync.timer=setTimeout(pushNow,1500);
}
function errText(e){var c=e&&e.code;return c==='quota_exceeded'?'Penyimpanan sinkron penuh':c==='invalid_argument'?'Data ditolak (mungkin akses hanya-lihat)':c==='unavailable'?'Layanan sedang tidak tersedia':c==='resource_exhausted'?'Terlalu sering, coba lagi nanti':'Tidak bisa tersambung'}
async function pushNow(){
  if(!sync.col||sync.st==='conflict')return;
  if(sync.busy){sync.dirty=true;return}
  sync.busy=true;sync.dirty=false;setSt('push');
  try{
    var snap=JSON.parse(JSON.stringify(S)),ver=snap.ver,col=sync.col,failedPhotos=0;
    var keep={};
    for(var i=0;i<snap.trxs.length;i++){var t=snap.trxs[i];
      if(t.photo){keep[t.id]=1;if(!sync.photos[t.id]){
        try{await col.doc('ph-'+t.id).set({data:t.photo});sync.photos[t.id]=1}catch(e){if(e&&e.code==='invalid_argument'){failedPhotos++}else throw e}}}
      else if(t.hasPhoto)keep[t.id]=1;}
    Object.keys(sync.photos).forEach(function(id){if(!keep[id]){col.doc('ph-'+id).delete().catch(function(){});delete sync.photos[id]}});
    var chunks=buildChunks(snap);
    for(var j=0;j<chunks.length;j++){var id='trx-'+j;if(sync.hashes[id]!==chunks[j]){await col.doc(id).set(JSON.parse(chunks[j]));sync.hashes[id]=chunks[j]}}
    for(var k=chunks.length;k<sync.chunkCount;k++){await col.doc('trx-'+k).delete();delete sync.hashes['trx-'+k]}
    sync.chunkCount=chunks.length;
    sync.lastPushedVer=ver;
    await col.doc('meta').set(buildMeta(snap,chunks.length));
    sync.base=ver;sync.lastAt=Date.now();await saveSyncMeta();
    setSt('ok',failedPhotos?failedPhotos+' foto terlalu besar, tidak ikut tersinkron':'');
  }catch(e){
    setSt('error',errText(e));
    clearTimeout(sync.retry);sync.retry=setTimeout(function(){if(sync.st==='error')pushNow()},15000);
  }finally{
    sync.busy=false;
    if(sync.dirty||(S.ver!==sync.base&&sync.st==='ok'))schedulePush();
  }
}
async function fetchRemote(meta){
  var trxs=[];
  for(var i=0;i<meta.chunkCount;i++){var s=await sync.col.doc('trx-'+i).get();if(!s.exists)throw {code:'unavailable'};trxs=trxs.concat(s.data().trxs)}
  if(trxs.length!==meta.trxCount)throw {code:'unavailable'};
  var pack=JSON.parse(JSON.stringify(Object.assign({},meta,{trxs:trxs})));delete pack.chunkCount;delete pack.trxCount;return pack;
}
function adoptRemote(pack,chunkCount){
  var localPh={};S.trxs.forEach(function(t){if(t.photo)localPh[t.id]=t.photo});
  pack.trxs.forEach(function(t){if(t.hasPhoto&&localPh[t.id])t.photo=localPh[t.id]});
  var keepLock=ui.locked;
  S=Object.assign(blank(),pack);migrate();
  sync.base=S.ver;sync.lastPushedVer=S.ver;sync.chunkCount=chunkCount;
  sync.hashes={};buildChunks(S).forEach(function(c,i){sync.hashes['trx-'+i]=c});
  sync.photos={};S.trxs.forEach(function(t){if(t.hasPhoto)sync.photos[t.id]=1});
  sync.lastAt=Date.now();ui.locked=keepLock;
  saveLocalSoon();saveSyncMeta();
}
async function doPull(meta){
  setSt('pull');
  try{
    var pack=await fetchRemote(meta);
    if(ui.sheet){ui.pendingPull=meta;setSt('ok');return}
    adoptRemote(pack,meta.chunkCount);setSt('ok');toast('Data diperbarui dari perangkat lain');
  }catch(e){setSt('error',errText(e))}
}
function summary(src){return {wallets:(src.wallets||[]).length,trx:src.trxCount!=null?src.trxCount:(src.trxs||[]).length,at:src.savedAt||0}}
function openConflict(meta){sync.conflict=meta;setSt('conflict');ui.draft=null;ui.sheet={k:'conflict'};render()}
function decide(m){
  var remote=m.exists?m.data():null,blankLocal=!S.onboarded&&!S.trxs.length;
  if(!S.ver)bump();
  if(!remote){if(!blankLocal)pushNow();else setSt('ok');return}
  if(remote.ver===S.ver){sync.base=S.ver;sync.lastPushedVer=S.ver;sync.chunkCount=remote.chunkCount;sync.hashes={};buildChunks(S).forEach(function(c,i){sync.hashes['trx-'+i]=c});saveSyncMeta();setSt('ok');return}
  if(blankLocal||sync.base===S.ver)return doPull(remote);
  if(sync.base===remote.ver){sync.chunkCount=remote.chunkCount;return pushNow()}
  openConflict(remote);
}
async function syncNow(){
  if(!sync.col)return;
  setSt('pull');
  try{var m=await sync.col.doc('meta').get();decide(m)}catch(e){setSt('error',errText(e))}
}
function onRemoteMeta(snap){
  if(!snap.exists)return;var rm=snap.data();
  if(rm.ver===sync.lastPushedVer||rm.ver===S.ver||rm.ver===sync.base)return;
  if(sync.busy||sync.st==='conflict')return;
  if(sync.base===S.ver)doPull(rm);else openConflict(rm);
}
async function initSync(){
  try{
    if(!window.claude||!claude.use){setSt('na','Sinkron antar HP hanya tersedia di versi yang dibuka lewat akun Claude. Di versi web mandiri, data tersimpan di browser ini; gunakan Cadangkan untuk memindahkan.');return}
    var user=await claude.use('user'),db=await claude.use('db');
    if(!user||!db){setSt('na','Fitur sinkron tidak tersedia di tampilan ini');return}
    var uid=await user.id();if(!uid){setSt('na','Masuk ke akun Claude untuk sinkron.');return}
    sync.db=db;sync.col=db.collection('data/users/'+uid);
    var k=await kvGet('sync')||{};sync.base=k.base||null;sync.photos=k.photos||{};sync.lastAt=k.lastAt||null;
    if(kvGetOff()){setSt('off');return}
    var m=await sync.col.doc('meta').get();decide(m);
    sync.unsub=sync.col.doc('meta').onSnapshot(onRemoteMeta,function(){});
  }catch(e){setSt('error',errText(e))}
}

function loadPhoto(id){
  var t=byId(S.trxs,id);if(!t||t.photo)return Promise.resolve(true);
